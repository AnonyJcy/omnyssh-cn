name: Sync Upstream & Update zh-cn

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC (10:00 AM Beijing Time)
  workflow_dispatch:      # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

# Avoid a scheduled run racing a manually dispatched sync on the same branch.
concurrency:
  group: sync-upstream-zh-cn
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with upstream repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zh-cn branch
        uses: actions/checkout@v4
        with:
          ref: zh-cn
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/timhartmann7/omnyssh.git || true
          git fetch upstream main --no-tags
          
          # Never prefer either side blindly: that could remove translations or fixes.
          if ! git merge upstream/main -m "chore(sync): merge upstream changes into zh-cn"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ -n "$conflicts" ]; then
              echo "::error::Upstream merge conflicts require manual resolution; zh-cn was not pushed."
              while IFS= read -r path; do
                echo "::error file=$path::Resolve upstream changes while preserving zh-cn customizations."
              done <<< "$conflicts"
              {
                echo '### Upstream sync stopped: merge conflicts'
                echo 'The remote zh-cn branch was not changed. Resolve these files locally, then commit and push the merge before retrying:'
                echo '```text'
                printf '%s\n' "$conflicts"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Upstream merge failed without file conflicts; inspect the Git error above."
            fi
            exit 1
          fi
          
          git push origin zh-cn
